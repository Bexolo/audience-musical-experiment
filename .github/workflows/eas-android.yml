name: EAS Android Build

# Manually triggered: Actions tab → "EAS Android Build" → Run workflow.
# Requires an EXPO_TOKEN repository secret (Expo account → Access Tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = installable APK)"
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify EXPO_TOKEN is set
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Link / create the EAS project
        run: eas init --non-interactive || true

      - name: Build Android APK
        # --no-wait returns immediately with a build URL. Open that URL on your
        # phone to install the APK (internal distribution), or grab it from the
        # Expo dashboard. EAS auto-generates an Android keystore on first build.
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --no-wait
